<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <title>Retro Run Riot - 3 Level Edition</title>
  <!-- Import a sci‑fi font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #000;
      font-family: 'Orbitron', monospace;
      color: #fff;
    }
    /* Ensure the canvas is focusable */
    canvas {
      display: block;
      margin: 20px auto;
      background: #111;
      image-rendering: pixelated;
      outline: none;
    }
  </style>
</head>
<body>
  <!-- tabindex ensures key events work -->
  <canvas id="gameCanvas" width="600" height="300" tabindex="1"></canvas>
  <!-- Background Music: Place your SID file as "c64.sid" in the same directory -->
  <audio id="bgMusic" loop>
    <source src="c64.sid" type="audio/x-sid">
    Your browser does not support the SID audio format.
  </audio>
  <script>
    // ===== Global Variables and Setup =====
    const canvas = document.getElementById('gameCanvas');
    canvas.focus();
    const ctx = canvas.getContext('2d');

    // Start background music on first user interaction.
    const bgMusic = document.getElementById("bgMusic");
    // Attempt to play when the user first clicks or presses a key.
    document.addEventListener("keydown", () => { bgMusic.play(); }, { once: true });

    // Audio Context for simple sound effects.
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(frequency, type, duration) {
      let randFactor = 0.95 + Math.random() * 0.1;
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.frequency.value = frequency * randFactor;
      oscillator.type = type;
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      oscillator.stop(audioCtx.currentTime + duration);
    }

    // Key state handling for left/right movement.
    const keys = {};
    document.addEventListener("keydown", function(e) {
      keys[e.code] = true;
      if (e.code === "Enter") {
        if (gameState === "intro") {
          startLevelIntro();
        } else if (gameState === "levelIntro" || gameState === "levelEnd") {
          startPlaying();
        } else if (gameState === "gameOver" || gameState === "win") {
          resetGame();
        }
      }
      if (e.code === "Space") {
        if (gameState === "playing" && player.onGround) {
          player.vy = player.jumpStrength;
          player.onGround = false;
          spawnParticleBurst();
          spawnEnergyPulse();
        }
      }
    });
    document.addEventListener("keyup", function(e) {
      keys[e.code] = false;
    });

    // Game States: "intro", "levelIntro", "playing", "levelEnd", "gameOver", "win"
    let gameState = "intro";
    let level = 1;
    let lives = 3;
    let levelScore = 0;
    let totalScore = 0;
    const levelDuration = 30; // seconds per level
    let levelTimeRemaining = levelDuration;
    let lastTime = 0;
    const groundY = 250;

    // Player Object (our cute robot)
    const player = {
      x: 50,
      y: groundY - 30,
      width: 20,
      height: 30,
      vy: 0,
      jumpStrength: -10,
      gravity: 0.5,
      onGround: true,
      wiggle: 0,
      speed: 3 // horizontal movement speed
    };

    // Obstacles and Coins Arrays
    let obstacles = [];
    let coins = [];
    let obstacleSpawnTimer = 0;
    let coinSpawnTimer = 0;
    function getObstacleSpawnInterval() {
      return Math.max(1.0, 2.0 - level * 0.1);
    }
    // Obstacle speed doubles each level.
    function getObstacleSpeed() {
      return 3 * Math.pow(2, level - 1);
    }
    function getCoinSpawnInterval() {
      return Math.max(1.5, 3.0 - level * 0.1);
    }
    function getCoinSpeed() {
      return 3 + level * 0.5;
    }
    let highScore = localStorage.getItem("retroRunRiotHighScore") || 0;

    // ===== Energy Pulse Animation =====
    let energyPulses = [];
    function spawnEnergyPulse() {
      energyPulses.push({
        x: player.x + player.width / 2,
        y: player.y + player.height / 2,
        radius: 0,
        life: 1.0
      });
    }
    function updateEnergyPulses(delta) {
      for (let i = energyPulses.length - 1; i >= 0; i--) {
        let pulse = energyPulses[i];
        pulse.radius += 100 * delta;
        pulse.life -= delta;
        if (pulse.life <= 0) energyPulses.splice(i, 1);
      }
    }
    function drawEnergyPulses() {
      energyPulses.forEach(pulse => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(pulse.x, pulse.y, pulse.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(0,255,255,${pulse.life})`;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
      });
    }

    // ===== State Management =====
    function startLevelIntro() {
      resetLevel();
      gameState = "levelIntro";
    }
    function startPlaying() {
      resetLevel();
      gameState = "playing";
      lastTime = performance.now();
    }
    function resetLevel() {
      levelScore = 0;
      levelTimeRemaining = levelDuration;
      obstacles = [];
      coins = [];
      obstacleSpawnTimer = 0;
      coinSpawnTimer = 0;
      player.x = 50;
      player.y = groundY - player.height;
      player.vy = 0;
      player.onGround = true;
      player.wiggle = 0;
    }
    function resetGame() {
      level = 1;
      lives = 3;
      totalScore = 0;
      gameState = "intro";
    }

    // ===== Camera Shake Effect =====
    let shakeTime = 0;
    let shakeMagnitude = 0;
    function triggerShake(duration, magnitude) {
      shakeTime = duration;
      shakeMagnitude = magnitude;
    }
    function applyCameraShake() {
      if (shakeTime > 0) {
        const shakeX = (Math.random() - 0.5) * shakeMagnitude;
        const shakeY = (Math.random() - 0.5) * shakeMagnitude;
        ctx.translate(shakeX, shakeY);
        shakeTime -= 16;
        shakeMagnitude *= 0.95;
      }
    }

    // ===== Abstract Overlay & Silly Clouds =====
    function drawAbstractOverlay() {
      let time = performance.now() / 1000;
      ctx.save();
      ctx.globalAlpha = 0.08;
      for (let i = 0; i < 12; i++) {
        let x = canvas.width * Math.random();
        let y = canvas.height * Math.random();
        let size = 20 + 30 * Math.abs(Math.sin(time + i));
        ctx.fillStyle = `hsl(${(time * 40 + i * 30) % 360}, 70%, 50%)`;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    const clouds = [];
    for (let i = 0; i < 3; i++) {
      clouds.push({
        x: Math.random() * canvas.width,
        y: Math.random() * (canvas.height / 3),
        size: 40 + Math.random() * 20,
        speed: 0.2 + Math.random() * 0.3
      });
    }
    function drawSillyClouds() {
      ctx.save();
      ctx.globalAlpha = 0.15;
      clouds.forEach(cloud => {
        cloud.x += cloud.speed;
        if (cloud.x > canvas.width + 50) cloud.x = -50;
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cloud.x, cloud.y + 5, cloud.size * 0.5, 0, Math.PI, false);
        ctx.stroke();
      });
      ctx.restore();
    }

    // ===== Particle System =====
    let particles = [];
    function spawnParticleBurst() {
      for (let i = 0; i < 15; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 2 + 1;
        particles.push({
          x: player.x + player.width / 2,
          y: player.y + player.height,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 3 + 2,
          life: 1.0,
          color: `rgba(0,${Math.floor(200 + Math.random()*55)},${Math.floor(200 + Math.random()*55)},1)`
        });
      }
    }
    function spawnParticle() {
      particles.push({
        x: player.x + player.width / 2,
        y: player.y + player.height / 2,
        vx: (Math.random()-0.5) * 1,
        vy: (Math.random()-0.5) * 1,
        size: Math.random()*2 + 1,
        life: 0.5,
        color: "rgba(0,255,0,1)"
      });
    }
    function updateParticles(delta) {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= delta;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }
    function drawParticles() {
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    // ===== Comic-Style Pop-Up Messages =====
    let popups = [];
    function getRandomPopupColor() {
      let r = Math.floor(200 + Math.random()*56);
      let g = Math.floor(200 + Math.random()*56);
      let b = Math.floor(200 + Math.random()*56);
      return `rgb(${r},${g},${b})`;
    }
    function addPopup(message, x, y) {
      if(message.indexOf("Ka-Ching!") > -1) { message += " 😂"; }
      popups.push({ message, x, y, lifetime: 1.0, color: getRandomPopupColor() });
    }
    function updatePopups(delta) {
      for (let i = popups.length - 1; i >= 0; i--) {
        popups[i].lifetime -= delta;
        popups[i].y -= 20 * delta;
        if (popups[i].lifetime <= 0) {
          popups.splice(i, 1);
        }
      }
    }
    function drawPopups() {
      popups.forEach(p => {
        ctx.save();
        let angle = (1 - p.lifetime) * 0.2;
        ctx.translate(p.x, p.y);
        ctx.rotate(angle);
        let scale = 1 + 0.2 * (1 - p.lifetime);
        ctx.scale(scale, scale);
        ctx.globalAlpha = p.lifetime;
        ctx.fillStyle = p.color;
        ctx.font = "20px 'Orbitron', monospace";
        ctx.textAlign = "center";
        ctx.fillText(p.message, 0, 0);
        ctx.restore();
      });
    }

    // ===== Afterimage Trail for the Player =====
    const afterImages = [];
    function saveAfterImage() {
      afterImages.push({
        x: player.x,
        y: player.y,
        time: performance.now()
      });
      if (afterImages.length > 10) afterImages.shift();
    }
    function drawAfterimages() {
      const now = performance.now();
      afterImages.forEach(img => {
        let alpha = Math.max(0, 1 - (now - img.time)/500);
        ctx.save();
        ctx.globalAlpha = alpha*0.5;
        ctx.fillStyle = "#0f0";
        ctx.fillRect(img.x, img.y, player.width, player.height);
        ctx.restore();
      });
    }

    // ===== Improved Player Drawing: Cute Gray & Red Robot =====
    function drawPlayer() {
      drawAfterimages();
      ctx.save();
      // Apply horizontal wiggle if hit.
      ctx.translate(player.wiggle, 0);
      // Set transformation origin to the center of the robot.
      const centerX = player.x + player.width / 2;
      const centerY = player.y + player.height / 2;
      ctx.translate(centerX, centerY);
      let scaleX = 1, scaleY = 1;
      if (player.onGround) {
        scaleX = 1.2; scaleY = 0.8;
      } else {
        const stretch = Math.min(-player.vy / 20, 0.3);
        scaleX = 1 - stretch * 0.7; scaleY = 1 + stretch;
      }
      const angle = player.vy * 0.2 + Math.sin(performance.now() / 200) * 0.1;
      ctx.rotate(angle);
      ctx.scale(scaleX, scaleY);
      // Draw the robot body as a gray rectangle.
      ctx.fillStyle = "#888";
      ctx.fillRect(-player.width/2, -player.height/2, player.width, player.height);
      // --- Draw Arms (in red) ---
      let armWidth = 5, armHeight = 10;
      ctx.fillStyle = "#F00";
      // Left arm.
      ctx.fillRect(-player.width/2 - armWidth, -player.height/4, armWidth, armHeight);
      // Right arm.
      ctx.fillRect(player.width/2, -player.height/4, armWidth, armHeight);
      // --- Draw Legs (in red) ---
      let legWidth = 5, legHeight = 10;
      // Left leg.
      ctx.fillRect(-player.width/4 - legWidth/2, player.height/2, legWidth, legHeight);
      // Right leg.
      ctx.fillRect(player.width/4 - legWidth/2, player.height/2, legWidth, legHeight);
      // --- Draw Eyes: White with Black Pupils ---
      let eyeRadius = 3;
      ctx.fillStyle = "#fff";
      // Left eye.
      ctx.beginPath();
      ctx.arc(-player.width/4, -player.height/4, eyeRadius, 0, Math.PI * 2);
      ctx.fill();
      // Right eye.
      ctx.beginPath();
      ctx.arc(player.width/4, -player.height/4, eyeRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#000";
      // Left pupil.
      ctx.beginPath();
      ctx.arc(-player.width/4, -player.height/4, eyeRadius/2, 0, Math.PI * 2);
      ctx.fill();
      // Right pupil.
      ctx.beginPath();
      ctx.arc(player.width/4, -player.height/4, eyeRadius/2, 0, Math.PI * 2);
      ctx.fill();
      // --- Draw a Cute Smiling Mouth ---
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 1;
      ctx.beginPath();
      // Position the smile a bit below the eyes.
      ctx.arc(0, -player.height/8, player.width/4, 0, Math.PI, false);
      ctx.stroke();
      ctx.restore();
      saveAfterImage();
    }

    // ===== Player Physics and Horizontal Movement =====
    let wasOnGround = true;
    function updatePlayerPhysics() {
      player.y += player.vy;
      player.vy += player.gravity;
      // Horizontal movement.
      if (keys["ArrowLeft"]) { player.x -= player.speed; }
      if (keys["ArrowRight"]) { player.x += player.speed; }
      if (player.x < 0) player.x = 0;
      if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
      if (player.y >= groundY - player.height) {
        if (!player.onGround) {
          player.wiggle = (Math.random()-0.5)*6;
          spawnParticleBurst();
          triggerShake(300,5);
          playSound(150,"square",0.1);
        }
        player.y = groundY - player.height;
        player.vy = 0;
        player.onGround = true;
        player.wiggle *= 0.8;
      } else { player.onGround = false; }
      wasOnGround = player.onGround;
    }

    // ===== Funny Obstacles with Animated Faces =====
    function spawnObstacle() {
      const obstacle = {
        x: canvas.width,
        y: groundY - 20,
        width: 20,
        height: 20,
        color: "rgb(" + (180 + Math.floor(Math.random()*76)) + ",0,0)"
      };
      obstacles.push(obstacle);
    }
    function drawObstacle(ob) {
      ctx.fillStyle = ob.color;
      ctx.fillRect(ob.x, ob.y, ob.width, ob.height);
      // Rotating abstract frame.
      ctx.save();
      ctx.translate(ob.x + ob.width/2, ob.y + ob.height/2);
      ctx.rotate(performance.now()/1000);
      ctx.strokeStyle = "rgba(255,255,255,0.3)";
      ctx.lineWidth = 2;
      ctx.strokeRect(-ob.width, -ob.height, ob.width*2, ob.height*2);
      ctx.restore();
      // Facial expression.
      let exprCycle = Math.floor(performance.now()/600) % 4;
      let eyeRadius = 2;
      let eyeY = ob.y + ob.height*0.3;
      let leftEyeX = ob.x + ob.width*0.3;
      let rightEyeX = ob.x + ob.width*0.7;
      if (exprCycle === 0) { // Normal blinking.
        let blink = Math.floor(performance.now()/300)%2===0;
        if (!blink) {
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(leftEyeX, eyeY, eyeRadius, 0, Math.PI*2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(rightEyeX, eyeY, eyeRadius, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = "#000";
          ctx.beginPath();
          ctx.arc(leftEyeX, eyeY, eyeRadius/2, 0, Math.PI*2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(rightEyeX, eyeY, eyeRadius/2, 0, Math.PI*2);
          ctx.fill();
        } else {
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(leftEyeX - eyeRadius, eyeY);
          ctx.lineTo(leftEyeX + eyeRadius, eyeY);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(rightEyeX - eyeRadius, eyeY);
          ctx.lineTo(rightEyeX + eyeRadius, eyeY);
          ctx.stroke();
        }
      } else if (exprCycle === 1) { // Wink.
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(leftEyeX, eyeY, eyeRadius, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(rightEyeX - eyeRadius, eyeY);
        ctx.lineTo(rightEyeX + eyeRadius, eyeY);
        ctx.stroke();
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(leftEyeX, eyeY, eyeRadius/2, 0, Math.PI*2);
        ctx.fill();
      } else if (exprCycle === 2) { // Surprised.
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(leftEyeX, eyeY, eyeRadius*1.5, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(rightEyeX, eyeY, eyeRadius*1.5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(leftEyeX, eyeY, eyeRadius, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(rightEyeX, eyeY, eyeRadius, 0, Math.PI*2);
        ctx.fill();
      } else { // Facepalm.
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(leftEyeX, eyeY, eyeRadius, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(rightEyeX, eyeY, eyeRadius, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "#000";
        ctx.fillRect(rightEyeX - eyeRadius, eyeY - eyeRadius - 3, eyeRadius*2, 3);
      }
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 1;
      let mouthX = ob.x + ob.width/2;
      let mouthY = ob.y + ob.height*0.7;
      let mouthWidth = ob.width*0.3;
      ctx.beginPath();
      ctx.arc(mouthX, mouthY, mouthWidth, 0, Math.PI, false);
      ctx.stroke();
    }

    // ===== Coins with Color Variation and Pulsation =====
    function spawnCoin() {
      const coin = {
        x: canvas.width,
        y: groundY - 20 - Math.random()*50,
        radius: 10,
        width: 20,
        height: 20,
        color: "rgb(255," + (230 + Math.floor(Math.random()*26)) + ",0)"
      };
      coins.push(coin);
    }

    // ===== Background Gradient with Shimmer =====
    function getBackgroundGradient() {
      let greenVal = Math.min(255, 144 + level*10);
      let shimmer = Math.floor(20*Math.sin(performance.now()/500));
      let hexGreen = (greenVal + shimmer).toString(16).padStart(2,"0");
      let topColor = "#00" + hexGreen + "FF";
      let gradient = ctx.createLinearGradient(0,0,0,canvas.height);
      gradient.addColorStop(0, topColor);
      gradient.addColorStop(1, "#000");
      return gradient;
    }

    // ===== Drawing Functions for HUD and Screens =====
    function drawIntro() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = getBackgroundGradient();
      ctx.fillRect(0,0,canvas.width,canvas.height);
      drawAbstractOverlay();
      drawSillyClouds();
      // ----- Prophecy Text -----
      ctx.font = "14px 'Orbitron', monospace";
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.fillText("Prophecy: In the realm of Taunhauser Gate, destiny awaits.", canvas.width/2, 30);
      ctx.fillText("Legend tells our brave robot is doomed to remain trapped", canvas.width/2, 45);
      ctx.fillText("until it conquers 3 worlds. Press Enter to begin your quest!", canvas.width/2, 60);
      // ----- Title -----
      ctx.save();
      let bounce = Math.sin(performance.now()/500)*5;
      let titleScale = 1 + 0.05*Math.sin(performance.now()/400);
      ctx.translate(canvas.width/2, canvas.height/2 - 20 + bounce);
      ctx.scale(titleScale, titleScale);
      let textGradient = ctx.createLinearGradient(-100,0,100,0);
      textGradient.addColorStop(0, "#0ff");
      textGradient.addColorStop(1, "#0f0");
      ctx.fillStyle = textGradient;
      ctx.font = "30px 'Orbitron', monospace";
      ctx.textAlign = "center";
      ctx.fillText("Retro Run Riot", 0, 0);
      ctx.restore();
      ctx.font = "16px 'Orbitron', monospace";
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.fillText("Press Enter to Start", canvas.width/2, canvas.height/2 + 20);
      ctx.fillText("Press Space to Jump, Arrow Keys to Move", canvas.width/2, canvas.height/2 + 40);
    }
    function drawLevelIntro() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#000";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#fff";
      ctx.font = "30px 'Orbitron', monospace";
      ctx.textAlign = "center";
      ctx.fillText("Level " + level, canvas.width/2, canvas.height/2 - 20);
      ctx.font = "16px 'Orbitron', monospace";
      ctx.fillText("Press Enter to Begin", canvas.width/2, canvas.height/2 + 20);
    }
    function drawLevelEnd() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#000";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#fff";
      ctx.font = "30px 'Orbitron', monospace";
      ctx.textAlign = "center";
      if (levelScore >= 1000) {
        ctx.fillText("Level Complete!", canvas.width/2, canvas.height/2 - 20);
        spawnConfetti();
        ctx.font = "16px 'Orbitron', monospace";
        ctx.fillText("Press Enter for Next Level", canvas.width/2, canvas.height/2 + 20);
      } else {
        ctx.fillText("Level Failed!", canvas.width/2, canvas.height/2 - 20);
        ctx.font = "16px 'Orbitron', monospace";
        ctx.fillText("Press Enter to Retry", canvas.width/2, canvas.height/2 + 20);
      }
    }
    function drawGameOver() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#000";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#f00";
      ctx.font = "30px 'Orbitron', monospace";
      ctx.textAlign = "center";
      ctx.fillText("Game Over", canvas.width/2, canvas.height/2 - 20);
      ctx.font = "16px 'Orbitron', monospace";
      ctx.fillStyle = "#fff";
      ctx.fillText("Total Score: " + totalScore, canvas.width/2, canvas.height/2 + 10);
      ctx.fillText("High Score: " + highScore, canvas.width/2, canvas.height/2 + 30);
      ctx.fillText("Press Enter to Restart", canvas.width/2, canvas.height/2 + 50);
    }
    function drawWin() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#000";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#0f0";
      ctx.font = "30px 'Orbitron', monospace";
      ctx.textAlign = "center";
      ctx.fillText("You Win!", canvas.width/2, canvas.height/2 - 20);
      ctx.font = "16px 'Orbitron', monospace";
      ctx.fillText("Total Score: " + totalScore, canvas.width/2, canvas.height/2 + 10);
      ctx.fillText("High Score: " + highScore, canvas.width/2, canvas.height/2 + 30);
      ctx.fillText("Press Enter to Restart", canvas.width/2, canvas.height/2 + 50);
    }
    function drawHUD() {
      ctx.fillStyle = "#fff";
      ctx.font = "16px 'Orbitron', monospace";
      ctx.textAlign = "left";
      ctx.fillText("Level: " + level, 10, 20);
      ctx.fillText("Lives: " + lives, 10, 40);
      ctx.fillText("Score: " + levelScore, 10, 60);
      ctx.fillText("Time: " + Math.floor(levelTimeRemaining), 10, 80);
      ctx.fillText("Total: " + totalScore, 10, 100);
      ctx.fillText("High: " + highScore, 10, 120);
    }

    // ===== Confetti Burst on Level Complete =====
    let confetti = [];
    function spawnConfetti() {
      for (let i = 0; i < 30; i++) {
        confetti.push({
          x: Math.random()*canvas.width,
          y: canvas.height/2,
          vx: (Math.random()-0.5)*4,
          vy: Math.random()*-3 - 1,
          size: 3 + Math.random()*2,
          life: 1.0,
          color: `hsl(${Math.random()*360},80%,60%)`
        });
      }
    }
    function updateConfetti(delta) {
      for (let i = confetti.length - 1; i >= 0; i--) {
        let c = confetti[i];
        c.x += c.vx;
        c.y += c.vy;
        c.vy += 0.1;
        c.life -= delta;
        if (c.life <= 0) {
          confetti.splice(i, 1);
        }
      }
    }
    function drawConfetti() {
      confetti.forEach(c => {
        ctx.save();
        ctx.globalAlpha = c.life;
        ctx.fillStyle = c.color;
        ctx.fillRect(c.x, c.y, c.size, c.size);
        ctx.restore();
      });
    }

    // ===== Main Draw Function =====
    function drawGame() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = getBackgroundGradient();
      ctx.fillRect(0,0,canvas.width,canvas.height);
      drawAbstractOverlay();
      drawSillyClouds();

      ctx.fillStyle = "#444";
      ctx.fillRect(0, groundY, canvas.width, canvas.height-groundY);

      ctx.save();
      applyCameraShake();

      obstacles.forEach(ob => { drawObstacle(ob); });
      coins.forEach(coin => {
        let pulsate = 1 + 0.1 * Math.sin(performance.now()/200);
        ctx.fillStyle = coin.color;
        ctx.beginPath();
        ctx.arc(coin.x + coin.radius, coin.y + coin.radius, coin.radius*pulsate, 0, Math.PI*2);
        ctx.fill();
      });

      drawParticles();
      drawPlayer();
      drawEnergyPulses();

      ctx.restore();

      drawPopups();
      drawConfetti();
      drawHUD();
    }

    // ===== Main Game Loop =====
    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      let delta = (timestamp - lastTime) / 1000;
      lastTime = timestamp;
      switch(gameState) {
        case "intro": drawIntro(); break;
        case "levelIntro": drawLevelIntro(); break;
        case "playing":
          updatePlayerPhysics();
          updateGame(delta);
          if (!player.onGround) spawnParticle();
          updateParticles(delta);
          updateEnergyPulses(delta);
          updateConfetti(delta);
          drawGame();
          break;
        case "levelEnd": drawLevelEnd(); break;
        case "gameOver": drawGameOver(); break;
        case "win": drawWin(); break;
      }
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    // ===== Game Logic: Obstacles, Coins, and Scoring =====
    function updateGame(delta) {
      levelTimeRemaining -= delta;
      if (levelTimeRemaining <= 0) {
        if (levelScore >= 1000) {
          totalScore += levelScore;
          level++;
          if (level > 3) {
            gameState = "win";
            if (totalScore > highScore) {
              highScore = totalScore;
              localStorage.setItem("retroRunRiotHighScore", highScore);
            }
          } else {
            gameState = "levelEnd";
          }
        } else {
          lives--;
          if (lives <= 0) {
            gameState = "gameOver";
            if (totalScore > highScore) {
              highScore = totalScore;
              localStorage.setItem("retroRunRiotHighScore", highScore);
            }
          } else {
            gameState = "levelEnd";
          }
        }
      }
      obstacleSpawnTimer -= delta;
      if (obstacleSpawnTimer <= 0) {
        spawnObstacle();
        obstacleSpawnTimer = getObstacleSpawnInterval();
      }
      for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= getObstacleSpeed();
        if (rectCollision(player, obstacles[i])) {
          addPopup("Ouch!", player.x+player.width/2, player.y);
          lives--;
          if (lives <= 0) {
            gameState = "gameOver";
            if (totalScore > highScore) {
              highScore = totalScore;
              localStorage.setItem("retroRunRiotHighScore", highScore);
            }
          } else {
            gameState = "levelEnd";
          }
        }
        if (obstacles[i].x + obstacles[i].width < 0) {
          obstacles.splice(i, 1);
        }
      }
      coinSpawnTimer -= delta;
      if (coinSpawnTimer <= 0) {
        spawnCoin();
        coinSpawnTimer = getCoinSpawnInterval();
      }
      for (let i = coins.length - 1; i >= 0; i--) {
        coins[i].x -= getCoinSpeed();
        if (rectCollision(player, coins[i])) {
          levelScore += 200;
          addPopup("Ka-Ching!", coins[i].x+coins[i].radius, coins[i].y+coins[i].radius);
          playSound(800, "sine", 0.1);
          coins.splice(i, 1);
        }
        if (coins[i] && coins[i].x + coins[i].radius*2 < 0) {
          coins.splice(i, 1);
        }
      }
      updatePopups(delta);
    }
    function rectCollision(a, b) {
      return a.x < b.x + b.width &&
             a.x + a.width > b.x &&
             a.y < b.y + b.height &&
             a.y + a.height > b.y;
    }
  </script>
</body>
